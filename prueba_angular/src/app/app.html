<!-- Modal de confirmación -->
@if (showDeleteModal()) {
<div class="modal-backdrop">
  <div class="modal-confirm">
    <h3>¿Eliminar post?</h3>
    <p>¿Seguro que deseas eliminar este post?</p>
    <div class="modal-actions">
      <button class="btn btn-danger" (click)="confirmDelete()">Eliminar</button>
      <button class="btn btn-light" (click)="cancelDelete()">Cancelar</button>
    </div>
  </div>
</div>
}

<div class="body-blank">
  <h1 class="center-title">{{ title() }}</h1>

  <div class="actions-container" style="text-align:center; margin:2rem; display: flex; justify-content: center;">
    <button class="new-post-btn" (click)="onNewPost()">New Post</button>
  </div>

  @if (showForm()) {
  <div>
    <app-post-form [post]="selectedPost()" [mode]="formMode()" (save)="onSavePost($event)" (cancel)="onCancelForm()" />
  </div>
  }

  @if (!showForm()) {
  <div class="cards-container">
    @for (card of cards(); track card.id) {
    <div class="card">
      <h2>{{ card.title }}</h2>
      <p>{{ card.body }}</p>
      <div class="card-meta">
        <span><b>User ID:</b> {{ card.userId }}</span>
        <span><b>ID:</b> {{ card.id }}</span>
      </div>
      <div class="card-actions" style="display: flex; gap: 0.5rem;">
        <button class="view-btn" (click)="onViewPost(card)" title="Ver">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-eye w-4 h-4 mr-1">
            <path
              d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0">
            </path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>Ver</span>
        </button>
        <button class="edit-btn" (click)="onEditPost(card)" title="Editar">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-pencil w-4 h-4 mr-1">
            <path
              d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z">
            </path>
            <path d="m15 5 4 4"></path>
          </svg>
          <span>Editar</span>
        </button>
        <button class="delete-btn" (click)="onDeletePost(card.id!)" title="Eliminar">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-trash2 w-4 h-4 mr-1">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            <line x1="10" x2="10" y1="11" y2="17"></line>
            <line x1="14" x2="14" y1="11" y2="17"></line>
          </svg>
          <span>Eliminar</span>
        </button>
      </div>
    </div>
    }
  </div>
  }
</div>
